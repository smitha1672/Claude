[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistkit-bench-jarvis-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]

[tool.hatch.build.targets.wheel]
packages = ["."]
